<!DOCTYPE html>
<html lang="zh-Hant" data-theme="system" data-font="md" data-device="auto" data-layout="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>孔乙己學習站</title>
<meta name="description" content="魯迅〈孔乙己〉互動學習網站：學習指引、互動視覺化、延伸學習、練習、測驗與學習歷程。">
<meta name="theme-color" content="#e5484d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孔乙己">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ea; --bg2:#ffefd6; --surface:#ffffff; --surface2:#fffaf2; --ink:#2b2238; --muted:#6a6177; --line:#eadfcd;
  --red:#e5484d; --redSoft:#ffe3e1; --jade:#0f9f7c; --jadeSoft:#d6f5ea; --gold:#f2a516; --goldSoft:#fff0cc;
  --indigo:#4f5bd5; --indigoSoft:#e3e6ff; --sky:#1b9fd6; --skySoft:#dcf2fc; --plum:#b4469a; --plumSoft:#fbe1f3;
  --wood:#9a6440; --woodSoft:#f3e2d2; --wall:#fbe8c8; --floor:#e8c9a0;
  --shadow:0 2px 0 rgba(43,34,56,.06),0 10px 30px -12px rgba(43,34,56,.25);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{ --bg:#16121e; --bg2:#1d1828; --surface:#231d30; --surface2:#2a2339; --ink:#f4eefc; --muted:#b5abc6; --line:#3a3150;
  --redSoft:#4a2228; --jadeSoft:#163d33; --goldSoft:#463716; --indigoSoft:#262b55; --skySoft:#15394a; --plumSoft:#43203b; --woodSoft:#3d2b20;
  --wall:#3a2e24; --floor:#4b3a2b; --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;}
@media (prefers-color-scheme:dark){
  html[data-theme="system"]{ --bg:#16121e; --bg2:#1d1828; --surface:#231d30; --surface2:#2a2339; --ink:#f4eefc; --muted:#b5abc6; --line:#3a3150;
  --redSoft:#4a2228; --jadeSoft:#163d33; --goldSoft:#463716; --indigoSoft:#262b55; --skySoft:#15394a; --plumSoft:#43203b; --woodSoft:#3d2b20;
  --wall:#3a2e24; --floor:#4b3a2b; --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;}
}
html{font-size:18px; -webkit-text-size-adjust:100%;}
html[data-font="sm"]{font-size:16px} html[data-font="lg"]{font-size:21px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 0%,var(--goldSoft) 0,transparent 35%),radial-gradient(circle at 100% 30%,var(--skySoft) 0,transparent 30%);background-attachment:fixed;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:8px}
h1,h2,h3,.serif{font-family:var(--serif);line-height:1.35;text-wrap:balance}
p,li{text-wrap:pretty}
.app{max-width:1240px;margin:0 auto;min-height:100vh;position:relative;background:transparent}
html[data-device="phone"] .app{max-width:430px;border-left:2px solid var(--line);border-right:2px solid var(--line);box-shadow:var(--shadow);background:var(--bg)}
html[data-device="tablet"]{--frame:840px}
html[data-device="tablet"] .app{max-width:840px;border-left:2px solid var(--line);border-right:2px solid var(--line);box-shadow:var(--shadow);background:var(--bg)}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem}
.brand{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1 1 auto}
.brand>div{min-width:0}
.seal{width:44px;height:44px;flex:none;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:1.35rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transform:rotate(-4deg)}
.brand-t{font-family:var(--serif);font-weight:900;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:.78rem;color:var(--muted);white-space:nowrap;line-height:1.2}
.nav{display:flex;gap:.3rem;margin-left:auto;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:.35rem;padding:.5rem .8rem;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.nav button svg{width:20px;height:20px}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button:active{transform:scale(.95)}
.iconbtn{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:1.3rem;transition:transform .15s,border-color .2s}
.iconbtn:hover{border-color:var(--ink)} .iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.progress-strip{height:5px;background:var(--line)}
.progress-strip i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold),var(--jade),var(--sky),var(--indigo));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* phone: bottom nav */
@media (max-width:1100px){.brand-s{display:none}}
@media (max-width:900px){ .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:2px solid var(--line);padding:.35rem .3rem calc(.35rem + env(safe-area-inset-bottom));z-index:60}
  .nav button{flex-direction:column;gap:.1rem;font-size:.72rem;padding:.35rem .4rem;border-radius:12px;min-width:56px}
  .nav button[aria-current="page"]{background:var(--redSoft);color:var(--red)}
  main{padding-bottom:6rem!important} .brand-s{display:none}
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)} }
html[data-device="phone"] .topbar,html[data-device="tablet"] .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
html[data-device="phone"] .nav,html[data-device="tablet"] .nav{position:fixed;left:50%;transform:translateX(-50%);width:min(var(--frame,430px),100%);bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:2px solid var(--line);padding:.35rem .3rem calc(.35rem + env(safe-area-inset-bottom));z-index:60}
html[data-device="phone"] .nav button,html[data-device="tablet"] .nav button{flex-direction:column;gap:.1rem;font-size:.72rem;padding:.35rem .4rem;border-radius:12px;min-width:56px}
html[data-device="phone"] .nav button[aria-current="page"],html[data-device="tablet"] .nav button[aria-current="page"]{background:var(--redSoft);color:var(--red)}
html[data-device="phone"] main,html[data-device="tablet"] main{padding-bottom:6rem!important}
html[data-device="phone"] .brand-s{display:none}

main{padding:1.25rem 1rem 3rem}
.page{display:none;animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Generic ---------- */
.sec-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin:2rem 0 1rem}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.kicker{display:inline-flex;align-items:center;gap:.4rem;font-weight:900;font-size:.82rem;letter-spacing:.08em;padding:.2rem .7rem;border-radius:999px;background:var(--goldSoft);color:#9a5d00}
html[data-theme="dark"] .kicker{color:var(--gold)}
@media (prefers-color-scheme:dark){html[data-theme="system"] .kicker{color:var(--gold)}}
.lead{color:var(--muted);font-size:1.02rem;max-width:60ch}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:1.25rem;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
html[data-layout="portrait"] .g2,html[data-layout="portrait"] .g3,html[data-layout="portrait"] .g4,html[data-layout="portrait"] .split{grid-template-columns:1fr!important}
html[data-layout="landscape"] .g2{grid-template-columns:repeat(2,1fr)} html[data-layout="landscape"] .g3{grid-template-columns:repeat(3,1fr)} html[data-layout="landscape"] .g4{grid-template-columns:repeat(4,1fr)}
html[data-layout="landscape"] .split{grid-template-columns:1.3fr 1fr!important}
html[data-device="phone"] .split,html[data-device="phone"] .g2,html[data-device="phone"] .g3,html[data-device="phone"] .g4,html[data-device="tablet"] .split{grid-template-columns:1fr!important}
html[data-device="phone"] .hero h1{font-size:2.1rem} html[data-device="phone"] .hero-art{opacity:.25;width:70%}
html[data-device="phone"] .sec-head h2{font-size:1.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:48px;padding:.6rem 1.15rem;border-radius:14px;font-weight:800;background:var(--surface);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff;border-color:#a8262b;box-shadow:0 4px 0 #a8262b}
.btn.jade{background:var(--jade);color:#fff;border-color:#08694f;box-shadow:0 4px 0 #08694f}
.btn.indigo{background:var(--indigo);color:#fff;border-color:#2f3a9e;box-shadow:0 4px 0 #2f3a9e}
.btn.gold{background:var(--gold);color:#3b2600;border-color:#a86c00;box-shadow:0 4px 0 #a86c00}
.btn.ghost{border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .65rem;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--bg2);border:1.5px solid var(--line)}
.muted{color:var(--muted)}
.quote{font-family:var(--serif);font-size:1.12rem;border-left:0;padding:.8rem 1rem;border-radius:var(--r-md);background:var(--surface2);position:relative}
.quote::before{content:"「";position:absolute;left:.3rem;top:-.4rem;font-size:2.2rem;color:var(--red);opacity:.35}
.tag-red{background:var(--redSoft);color:var(--red);border-color:transparent}
.tag-jade{background:var(--jadeSoft);color:var(--jade);border-color:transparent}
.tag-gold{background:var(--goldSoft);color:#9a5d00;border-color:transparent}
.tag-indigo{background:var(--indigoSoft);color:var(--indigo);border-color:transparent}
.tag-sky{background:var(--skySoft);color:var(--sky);border-color:transparent}
.tag-plum{background:var(--plumSoft);color:var(--plum);border-color:transparent}
.meter{height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1.5px solid var(--line)}
.meter i{display:block;height:100%;border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* ---------- Hero ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:clamp(1.4rem,4vw,3rem);background:linear-gradient(135deg,#ff6b5c 0%,#f2a516 55%,#ffd36e 100%);color:#2b1606;box-shadow:var(--shadow);isolation:isolate}
.hero h1{font-size:clamp(2rem,6vw,3.8rem);font-weight:900;letter-spacing:.02em}
.hero h1 em{font-style:normal;background:#fff;color:var(--red);padding:0 .25em;border-radius:12px;box-shadow:0 4px 0 #b9332f}
.hero p{max-width:52ch;font-size:1.05rem;margin-top:.8rem;font-weight:500}
.hero .row{margin-top:1.2rem}
.hero .btn{border-color:#2b1606;box-shadow:0 4px 0 #2b1606}
.hero-art{position:absolute;right:-10px;bottom:-12px;width:min(46%,420px);z-index:-1;opacity:.95}
.bean{position:absolute;width:16px;height:12px;border-radius:50%;background:#7a5a2a;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);animation:floaty 6s ease-in-out infinite;z-index:-1}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(25deg)}}
.steam path{animation:steam 3s ease-in-out infinite;transform-origin:center}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-22px)}}
@media (max-width:640px){.hero-art{opacity:.25;width:70%}}

/* ---------- Guide ---------- */
.goal{display:flex;gap:.8rem;align-items:flex-start}
.goal .num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.2rem;color:#fff}
.path{display:grid;gap:.8rem;counter-reset:st}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;padding:.9rem 1rem;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);transition:border-color .2s,transform .2s}
.step:hover{border-color:var(--ink);transform:translateX(4px)}
.step .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--bg2);border:2px solid var(--line)}
.step.done .dot{background:var(--jade);color:#fff;border-color:var(--jade)}
.step h4{font-size:1.05rem}
.step small{color:var(--muted);display:block;line-height:1.5}
.author{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center}
.portrait-ph{width:96px;height:120px;border-radius:16px;background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 8px,var(--surface2) 8px,var(--surface2) 16px);border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:900;font-size:1.6rem;color:var(--wood)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.95rem}
.facts dt{font-weight:800;color:var(--muted)}

/* ---------- Explore ---------- */
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{padding:.55rem 1rem;border-radius:14px;font-weight:800;border:2px solid var(--line);background:var(--surface);display:flex;gap:.4rem;align-items:center;transition:all .2s}
.tabs button .ck{display:none;color:var(--jade)}
.tabs button.seen .ck{display:inline}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.viz{display:none} .viz.active{display:block;animation:pageIn .4s}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:1rem}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.stage-svg{width:100%;height:auto;display:block;border-radius:var(--r-lg);border:3px solid var(--ink);background:var(--wall)}
.hot{cursor:pointer;transition:transform .2s}
.hot:hover,.hot.on{transform:translateY(-4px)}
.hot circle.ring{opacity:0}
.hot.on circle.ring{opacity:1;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{r:30;opacity:.8}to{r:46;opacity:0}}
.info{min-height:260px}
.info h3{font-size:1.4rem;display:flex;gap:.5rem;align-items:center}
.tok{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;color:#fff;font-family:var(--serif);font-weight:900;font-size:1.15rem;flex:none}
.toggle{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:50px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;cursor:pointer}
.toggle input::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--jade)} .toggle input:checked::after{left:25px}

input[type=range]{width:100%;accent-color:var(--red);height:36px}
.tl-steps{display:flex;justify-content:space-between;gap:.3rem;margin-top:.2rem}
.tl-steps button{flex:1;padding:.4rem .2rem;border-radius:12px;font-size:.82rem;font-weight:800;color:var(--muted);border:2px solid transparent;line-height:1.3}
.tl-steps button.on{color:var(--red);border-color:var(--red);background:var(--redSoft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.45rem .9rem;align-items:start}
.kv b{color:var(--muted);font-size:.9rem;white-space:nowrap;padding-top:.1rem}

.laughs{display:grid;gap:.6rem}
.laugh{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center;padding:.8rem 1rem;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);text-align:left;transition:all .2s}
.laugh:hover{border-color:var(--gold)}
.laugh.on{border-color:var(--red);background:var(--redSoft)}
.laugh .n{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--goldSoft);color:#9a5d00}
.who{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.who span{font-size:.8rem;padding:.05rem .5rem;border-radius:999px;background:var(--bg2);opacity:.35}
.who span.y{opacity:1;background:var(--gold);color:#3b2600;font-weight:800}
.wave{display:flex;gap:4px;align-items:flex-end;height:90px;margin:.6rem 0}
.wave i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--red),var(--gold));transition:height .4s}
.wave.go i{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{to{transform:scaleY(.4)}}
.wave i{transform-origin:bottom}

.spectrum{user-select:none;-webkit-user-select:none;position:relative;height:150px;border-radius:var(--r-lg);background:linear-gradient(90deg,#3a1f2a,var(--red) 25%,var(--gold) 55%,var(--jade) 100%);margin:1.2rem 0 .4rem;border:3px solid var(--ink);touch-action:none}
.spectrum .lbl{position:absolute;bottom:-1.9rem;font-size:.85rem;font-weight:800;color:var(--muted)}
.marker{user-select:none;-webkit-user-select:none;position:absolute;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:900;font-size:1.05rem;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);cursor:grab;touch-action:none;transition:box-shadow .2s;z-index:2}
.marker.drag{cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:5}
.marker.ref{opacity:.95;width:20px;height:20px;margin:-10px 0 0 -10px;border-width:2px;font-size:0;cursor:default;top:-16px!important;pointer-events:none}
.tray{display:flex;gap:.6rem;flex-wrap:wrap;min-height:64px;padding:.6rem;border:2px dashed var(--line);border-radius:var(--r-md);margin-top:2.6rem}
.tray .marker{position:relative;top:auto;margin:0}

.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1rem}
.flip{perspective:1000px;min-height:210px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;min-height:210px;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;border-radius:var(--r-lg);padding:1.1rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;border:3px solid var(--ink)}
.flip-f{background:var(--surface);font-family:var(--serif);font-size:1.2rem;font-weight:900;text-align:center;align-items:center}
.flip-f small{font-family:var(--sans);font-weight:700;font-size:.8rem;color:var(--muted);margin-top:.6rem}
.flip-b{transform:rotateY(180deg);background:var(--indigo);color:#fff;font-size:.95rem}
.flip-b b{display:block;font-size:1.02rem;margin-bottom:.3rem;color:#ffe08a}
.lens{display:flex;gap:.5rem;flex-wrap:wrap}
.lens button{flex:1;min-width:140px;padding:.8rem;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);font-weight:800;text-align:left;transition:all .2s;line-height:1.4}
.lens button small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}

  <div id="attOut" style="margin-top:1rem"></div></div>`;
 const spec=$('#spec'),tray=$('#tray');
 const TOPS=[32,68,32,68,50];
 ATT.forEach((a,ai)=>{const r=ROLE[a.k];const m=document.createElement('div');m.className='marker';m.style.background=r.c;m.textContent=r.ch;m.title=L(r);m.dataset.k=a.k;m.setAttribute('aria-label',L(r));
  if(attPos[a.k]!=null){m.style.left=attPos[a.k]+'%';m.style.top=TOPS[ai]+'%';spec.appendChild(m)}else tray.appendChild(m);
  m.addEventListener('pointerdown',e=>{e.preventDefault();m.classList.add('drag');SFX.click();
   const move=ev=>{ev.preventDefault();const sr=spec.getBoundingClientRect();if(m.parentElement!==spec){spec.appendChild(m)}let x=(ev.clientX-sr.left)/sr.width*100;x=Math.max(3,Math.min(97,x));m.style.left=x+'%';m.style.top=TOPS[ai]+'%';attPos[a.k]=x};
   const up=ev=>{m.classList.remove('drag');window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);const sr=spec.getBoundingClientRect();if(ev.clientY<sr.top-60||ev.clientY>sr.bottom+60){delete attPos[a.k];tray.appendChild(m);m.style.left='';m.style.top=''}else tone(500+(attPos[a.k]||0)*4,.08,'triangle',.12)};

    <div class="field"><label for="pfCls">${zh?'班級':'Class'}</label><input id="pfCls" value="${esc(P.profile.cls)}"></div>
    <div class="field"><label for="pfSeat">${zh?'座號':'No.'}</label><input id="pfSeat" value="${esc(P.profile.seat)}"></div>
   </div>
   <h3 style="margin:1rem 0 .5rem">⬇️ ${zh?'下載學習歷程':'Download portfolio'}</h3>
   <div class="row"><button class="btn primary" data-dl="html">${I.down} ${zh?'學習報告 (HTML)':'Report (HTML)'}</button><button class="btn gold" data-dl="txt">${I.down} TXT</button><button class="btn ghost" data-dl="csv">${I.down} CSV</button><button class="btn ghost" data-dl="json">${I.down} JSON</button></div>
   <p class="muted" style="font-size:.85rem;margin-top:.5rem">${zh?'紀錄只存在這台裝置的瀏覽器中，換裝置前請先下載。':'Records live only in this browser — download before switching devices.'}</p></div>
 </div>
 <div class="card" style="margin-top:1rem"><h3 style="margin-bottom:.6rem">💭 ${zh?'學習反思':'Reflection'}</h3>
  <div style="display:grid;gap:.8rem">${RQ[S.lang].map((q,i)=>`<div class="field"><label for="rq${i+1}">${i+1}. ${q}</label><textarea id="rq${i+1}" rows="3">${esc(P.notes['q'+(i+1)]||'')}</textarea></div>`).join('')}
  <div class="field"><label for="rqf">📒 ${zh?'自由筆記':'Free notes'}</label><textarea id="rqf" rows="3">${esc(P.notes.free||'')}</textarea></div></div>
  <div class="row" style="margin-top:.8rem"><button class="btn jade" id="saveNotes">💾 ${zh?'儲存反思':'Save reflection'}</button></div></div>
 <div class="card" style="margin-top:1rem"><div class="row" style="justify-content:space-between;margin-bottom:.6rem"><h3>🧾 ${zh?'學習足跡':'Activity log'} <span class="chip">${P.log.length}</span></h3><button class="btn ghost" id="clearAll" style="min-height:40px">🗑 ${zh?'清除紀錄':'Clear'}</button></div>
  <div class="log">${P.log.length?P.log.map(x=>{const ic=LOGI[x.type]||['•','var(--bg2)'];return `<div class="it"><span class="ic" style="background:${ic[1]}">${ic[0]}</span><span style="font-size:.95rem;word-break:break-word">${esc(zh?x.zh:x.en)}</span><time>${fmt(x.t)}</time></div>`}).join(''):`<p class="muted" style="text-align:center;padding:1.5rem">${zh?'還沒有紀錄，開始探索吧！':'Nothing yet — start exploring!'}</p>`}</div></div>`;
 ['Name','Cls','Seat'].forEach(k=>{$('#pf'+k).oninput=e=>{P.profile[k.toLowerCase()==='name'?'name':k.toLowerCase()]=e.target.value;saveP()}});
 $('#saveNotes').onclick=()=>{P.notes.q1=$('#rq1').value;P.notes.q2=$('#rq2').value;P.notes.q3=$('#rq3').value;P.notes.free=$('#rqf').value;log('note','更新學習反思','Updated reflection');SFX.ok();toast(t('saved')+' 🌱');renderPortfolio()};
 $$('[data-dl]',el).forEach(b=>b.onclick=()=>{SFX.click();download(b.dataset.dl)});
 $('#clearAll').onclick=()=>confirmBox(zh?'確定要清除所有學習歷程嗎？此動作無法復原。':'Clear all records? This cannot be undone.',()=>{P.log=[];P.explored=[];P.steps=[];P.quizzes=[];P.practice=[];P.notes={q1:'',q2:'',q3:'',free:''};saveP();updateProgress();renderAll();go('portfolio',true);toast(zh?'已清除':'Cleared')});
}
function download(kind){
 const zh=S.lang==='zh',now=new Date(),stamp=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 const name=P.profile.name||(zh?'學生':'student');
 const best=P.quizzes.length?Math.max(...P.quizzes.map(x=>x.score)):'-';
 let data,mime,ext;
 if(kind==='json'){data=JSON.stringify({unit:'魯迅〈孔乙己〉',exported:now.toISOString(),...P},null,2);mime='application/json';ext='json'}
 else if(kind==='csv'){const rows=[['time','type','record','score']].concat(P.log.slice().reverse().map(x=>[x.t,x.type,zh?x.zh:x.en,x.score??'']));data='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');mime='text/csv';ext='csv'}
 else if(kind==='txt'){const L2=[];L2.push('魯迅〈孔乙己〉學習歷程','='.repeat(28),`姓名：${P.profile.name}　班級：${P.profile.cls}　座號：${P.profile.seat}`,`匯出時間：${now.toLocaleString('zh-TW')}`,'',`完成學習步驟：${P.steps.length}/${STEPS.length}`,`探索互動元件：${Math.min(6,P.explored.length)}/6`,`練習次數：${P.practice.length}`,`測驗次數：${P.quizzes.length}　最高分：${best}`,'','【學習反思】');RQ.zh.forEach((q,i)=>L2.push(`${i+1}. ${q}`,'   '+(P.notes['q'+(i+1)]||'（未填寫）')));L2.push('自由筆記：'+(P.notes.free||'（無）'),'','【學習足跡】');P.log.slice().reverse().forEach(x=>L2.push(`${new Date(x.t).toLocaleString('zh-TW')}  ${x.zh}`));data='﻿'+L2.join('\r\n');mime='text/plain';ext='txt'}
 else{const rows=P.log.slice().reverse().map(x=>`<tr><td>${new Date(x.t).toLocaleString('zh-TW')}</td><td>${esc(x.zh)}</td><td>${x.score??''}</td></tr>`).join('');
  const qbars=P.quizzes.map((x,i)=>`<div style="flex:1;text-align:center;font-size:12px"><div style="height:${x.score}px;background:#4f5bd5;border-radius:6px 6px 0 0;margin:0 3px"></div>#${i+1}<br>${x.score}</div>`).join('');
  data=`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>孔乙己學習報告-${esc(name)}</title><style>body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#2b2238;line-height:1.7;font-size:17px}h1{color:#e5484d;font-family:serif}h2{border-left:8px solid #f2a516;padding-left:.6rem;margin-top:2rem}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}.s{background:#fff4e0;border-radius:12px;padding:.8rem;text-align:center}.s b{display:block;font-size:1.8rem;color:#e5484d}table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid #eadfcd;padding:.4rem;text-align:left}.q{background:#f6f2ff;border-radius:12px;padding:.8rem;margin:.5rem 0}@media print{body{margin:0}}</style></head><body>
  <h1>魯迅〈孔乙己〉學習報告</h1><p>姓名：${esc(P.profile.name)}　班級：${esc(P.profile.cls)}　座號：${esc(P.profile.seat)}<br>匯出時間：${now.toLocaleString('zh-TW')}</p>
  <div class="g"><div class="s"><b>${P.steps.length}/${STEPS.length}</b>學習步驟</div><div class="s"><b>${Math.min(6,P.explored.length)}/6</b>互動元件</div><div class="s"><b>${P.practice.length}</b>練習次數</div><div class="s"><b>${best}</b>測驗最高分</div></div>
  <h2>測驗成績</h2>${P.quizzes.length?`<div style="display:flex;align-items:flex-end;height:130px;border-bottom:2px solid #2b2238">${qbars}</div>`:'<p>尚無測驗紀錄</p>'}
  <h2>學習反思</h2>${RQ.zh.map((q,i)=>`<div class="q"><b>${i+1}. ${q}</b><p>${esc(P.notes['q'+(i+1)]||'（未填寫）').replace(/\n/g,'<br>')}</p></div>`).join('')}<div class="q"><b>自由筆記</b><p>${esc(P.notes.free||'（無）').replace(/\n/g,'<br>')}</p></div>
  <h2>學習足跡</h2><table><tr><th>時間</th><th>紀錄</th><th>分數</th></tr>${rows}</table></body></html>`;mime='text/html';ext='html'}
 const blob=new Blob([data],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const tag=[P.profile.cls,P.profile.seat].map(x=>String(x||'').replace(/[^\w-]/g,'')).filter(Boolean).join('-');a.download=`KongYiji_Portfolio${tag?'_'+tag:''}_${stamp}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast(zh?'已下載 '+ext.toUpperCase():'Downloaded '+ext.toUpperCase());
}
function confirmBox(msg,ok){const bg=$('#confirmBg'),m=$('#confirmModal'),zh=S.lang==='zh';m.innerHTML=`<h3>⚠️ ${zh?'請確認':'Confirm'}</h3><p>${msg}</p><div class="row" style="margin-top:1rem;justify-content:flex-end"><button class="btn ghost" id="cfNo">${zh?'取消':'Cancel'}</button><button class="btn primary" id="cfYes">${zh?'確定清除':'Clear'}</button></div>`;bg.classList.add('open');SFX.bad();
 $('#cfNo').onclick=()=>bg.classList.remove('open');$('#cfYes').onclick=()=>{bg.classList.remove('open');ok()};bg.onclick=e=>{if(e.target===bg)bg.classList.remove('open')}}

/* =========================================================
   SETTINGS
   ========================================================= */
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function setFs(on){const d=document.documentElement;try{if(on){(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}else if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}}catch(e){toast(t('fsNo'))}}
function applySettings(){const h=document.documentElement;h.dataset.theme=S.theme;h.dataset.font=S.font;h.dataset.device=S.device;h.dataset.layout=S.layout;h.lang=S.lang==='zh'?'zh-Hant':'en';
 const dark=S.theme==='dark'||(S.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);$('meta[name=theme-color]').setAttribute('content',dark?'#16121e':'#e5484d');
 $('#soundQuick').innerHTML=S.sound?I.soundOn:I.soundOff;$('#soundQuick').setAttribute('aria-label',t('sSound')+': '+(S.sound?t('on'):t('off')));
 document.title=S.lang==='zh'?'孔乙己學習站':'Kong Yiji Study Hub';}
function renderSettings(){
 const fsOk=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
 const rows=[
  ['fs','⛶',t('sFs'),[[true,t('on')],[false,t('off')]],isFs()],
  ['sound','🔊',t('sSound'),[[true,t('on')],[false,t('off')]],S.sound],
  ['device','📱',t('sDevice'),[['auto',t('auto')],['phone',t('phone')],['tablet',t('tablet')],['desktop',t('desktop')]],S.device],
  ['layout','🔄',t('sLayout'),[['auto',t('auto')],['portrait',t('portrait')],['landscape',t('landscape')]],S.layout],
  ['lang','🌐',t('sLang'),[['zh','繁體中文'],['en','English']],S.lang],
  ['font','🔠',t('sFont'),[['sm',t('fSm')],['md',t('fMd')],['lg',t('fLg')]],S.font],
  ['theme','🎨',t('sTheme'),[['system',t('system')],['light',t('light')],['dark',t('dark')]],S.theme]];
 $('#settingsModal').innerHTML=`<h3 id="setTitle"><span>⚙️ ${t('settings')}</span><button class="iconbtn" id="setX" aria-label="${t('close')}">✕</button></h3>
 ${rows.map(([k,ic,lab,opts,val])=>`<div class="set-row"><span class="lab">${ic} ${lab}${k==='fs'&&!fsOk?` <small class="muted">（${t('fsNo')}）</small>`:''}</span><div class="seg" role="radiogroup" aria-label="${lab}">${opts.map(([v,txt])=>`<button role="radio" aria-checked="${v===val}" class="${v===val?'on':''}" data-k="${k}" data-v="${v}" ${k==='fs'&&!fsOk?'disabled':''}>${txt}</button>`).join('')}</div></div>`).join('')}
 <div class="row" style="margin-top:1rem;justify-content:space-between"><button class="btn ghost" id="setReset">${I.redo} ${t('resetAll')}</button><button class="btn primary" id="setDone">${t('close')}</button></div>`;
 $$('#settingsModal .seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;
  if(k==='fs'){setFs(v);setTimeout(renderSettings,250);SFX.click();return}
  const old=S[k];S[k]=v;saveS();applySettings();if(k==='sound'&&v)ac();SFX.click();
  if(k==='lang'&&old!==v){renderAll();go(current,true)}
  renderSettings()});
 $('#setX').onclick=$('#setDone').onclick=closeSettings;
 $('#setReset').onclick=()=>{Object.assign(S,{sound:true,device:'auto',layout:'auto',lang:'zh',font:'md',theme:'system'});saveS();applySettings();renderAll();go(current,true);renderSettings();SFX.ok()};
}
function openSettings(){renderSettings();$('#settingsBg').classList.add('open');SFX.tab();setTimeout(()=>{const m=$('#settingsModal');m.scrollTop=0;const b=$('#setX');b&&b.focus({preventScroll:true})},50)}
function closeSettings(){$('#settingsBg').classList.remove('open');SFX.click();$('#openSettings').focus()}

/* =========================================================
   INIT
   ========================================================= */
function renderAll(){
 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#nav').setAttribute('aria-label',S.lang==='zh'?'主選單':'Main menu');
 $('#footer').textContent=t('footer');
 renderNav();renderGuide();renderExplore();renderExtend();renderPractice();renderQuiz();if(current==='portfolio')renderPortfolio();
}
applySettings();renderAll();
go((location.hash||'#guide').slice(1),true);
updateProgress();
$('#openSettings').onclick=openSettings;
$('#settingsBg').onclick=e=>{if(e.target.id==='settingsBg')closeSettings()};
$('#soundQuick').onclick=()=>{S.sound=!S.sound;saveS();applySettings();if(S.sound){ac();SFX.ok()}toast(t('sSound')+'：'+(S.sound?t('on'):t('off')))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#settingsBg').classList.contains('open'))closeSettings();$('#confirmBg').classList.remove('open')}});
document.addEventListener('fullscreenchange',()=>{if($('#settingsBg').classList.contains('open'))renderSettings()});
window.addEventListener('hashchange',()=>go(location.hash.slice(1),true));
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applySettings);
let resizeT;window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(curViz==='speech'&&current==='explore'){}},200)});
/* first visit of the day */
const today=new Date().toISOString().slice(0,10);
if(store.get('kyj-lastvisit','')!==today){store.set('kyj-lastvisit',today);log('visit','進入學習站','Visited the study hub')}

/* PWA service worker */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
})();
</script>
</body>
</html>
